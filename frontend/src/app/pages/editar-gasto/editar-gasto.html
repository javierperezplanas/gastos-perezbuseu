<div class="editar-gasto-container">

  <!-- CABECERA -->

  <div class="pagina-cabecera">

    <button
      class="btn-volver"
      (click)="volver()"
    >
      ← Volver
    </button>


    <div>

      <h1>
        Editar gasto
      </h1>

      <p>
        Modifica los datos del gasto
      </p>

    </div>

  </div>


  <!-- CARGANDO -->

  <div
    class="mensaje"
    *ngIf="cargando"
  >

    Cargando gasto...

  </div>


  <!-- ERROR -->

  <div
    class="mensaje error"
    *ngIf="error"
  >

    {{ error }}

  </div>


  <!-- FORMULARIO -->

  <div
    class="formulario"
    *ngIf="
      !cargando &&
      !error
    "
  >

    <!-- DESCRIPCIÓN -->

    <div class="campo">

      <label for="descripcion">
        Descripción
      </label>


      <input
        id="descripcion"
        type="text"
        placeholder="Ej. Cena en el restaurante"
        [(ngModel)]="descripcion"
        name="descripcion"
      >

    </div>


    <!-- CATEGORÍA -->

    <div class="campo">

      <label for="categoria">
        Categoría
      </label>


      <select
        id="categoria"
        [(ngModel)]="categoria"
        name="categoria"
      >

        <option value="">
          Selecciona una categoría
        </option>


        <option value="GENERAL">
          🌐 General
        </option>


        <option value="ALIMENTOS">
          🛒 Alimentos
        </option>


        <option value="RESTAURANTES">
          🍽️ Restaurantes
        </option>


        <option value="OTROS">
          📦 Otros
        </option>

      </select>

    </div>


    <!-- IMPORTE -->

    <div class="campo">

      <label for="importe">
        Importe
      </label>


      <div class="importe-input">

        <input
          id="importe"
          type="number"
          step="0.01"
          min="0.01"
          placeholder="0,00"
          [(ngModel)]="importe"
          name="importe"
        >


        <span>
          €
        </span>

      </div>

    </div>


    <!-- QUIÉN HA PAGADO -->

    <div class="campo">

      <label for="pagador">
        Ha pagado
      </label>


      <select
        id="pagador"
        [(ngModel)]="pagador"
        name="pagador"
      >

        <option
          [ngValue]="0"
        >
          Selecciona quién ha pagado
        </option>


        <option
          [ngValue]="1"
        >
          Javi
        </option>


        <option
          [ngValue]="2"
        >
          Miriam
        </option>

      </select>

    </div>


    <!-- FECHA -->

    <div class="campo">

      <label for="fecha">
        Fecha
      </label>


      <input
        id="fecha"
        type="date"
        [(ngModel)]="fecha"
        name="fecha"
      >

    </div>


    <!-- BOTONES -->

    <div class="formulario-botones">

      <button
        class="btn-cancelar"
        type="button"
        (click)="volver()"
        [disabled]="guardando"
      >
        Cancelar
      </button>


      <button
        class="btn-guardar"
        type="button"
        (click)="guardarCambios()"
        [disabled]="guardando"
      >

        <span *ngIf="!guardando">
          💾 Guardar cambios
        </span>


        <span *ngIf="guardando">
          Guardando...
        </span>

      </button>

    </div>

  </div>

</div>
