<div class="nuevo-gasto-container">

  <div class="pagina-cabecera">

    <button
      class="btn-volver"
      (click)="volver()"
    >
      ← Volver
    </button>


    <h1>

      @if (gastoId !== null) {

        Editar gasto

      } @else {

        Añadir gasto

      }

    </h1>


    <p>

      @if (gastoId !== null) {

        Modifica los datos del gasto

      } @else {

        Añade un nuevo gasto al grupo

      }

    </p>

  </div>


  <div class="formulario">


    <!-- =====================
         DESCRIPCIÓN
    ====================== -->

    <div class="campo">

      <label for="descripcion">

        Descripción

      </label>


      <input
        id="descripcion"
        type="text"
        placeholder="Ej. Cena en el restaurante"
        [(ngModel)]="descripcion"
        name="descripcion"
      >

    </div>


    <!-- =====================
         CATEGORÍA
    ====================== -->

    <div class="campo">

      <label for="categoria">

        Categoría

      </label>


      <select
        id="categoria"
        [(ngModel)]="categoria"
        name="categoria"
      >

        <option value="">

          Selecciona una categoría

        </option>


        <option value="GENERAL">

          🌐 General

        </option>


        <option value="ALIMENTOS">

          🛒 Alimentos

        </option>


        <option value="RESTAURANTES">

          🍽️ Restaurantes

        </option>


        <option value="OTROS">

          📦 Otros

        </option>

      </select>

    </div>


    <!-- =====================
         IMPORTE
    ====================== -->

    <div class="campo">

      <label for="importe">

        Importe

      </label>


      <div class="importe-input">

        <input
          id="importe"
          type="number"
          step="0.01"
          min="0.01"
          placeholder="0,00"
          [(ngModel)]="importe"
          name="importe"
        >


        <span>

          €

        </span>

      </div>

    </div>


    <!-- =====================
         PAGADOR
    ====================== -->

    <div class="campo">

      <label for="pagador">

        Ha pagado

      </label>


      <select
        id="pagador"
        [(ngModel)]="pagador"
        name="pagador"
      >

        <option value="">

          Selecciona quién ha pagado

        </option>


        @for (
          miembro of miembros;
          track miembro.usuario.id
        ) {

          <option
            [value]="miembro.usuario.id"
          >

            {{ miembro.usuario.nombre }}

          </option>

        }

      </select>

    </div>


    <!-- =====================
         DIVIDIR GASTO
    ====================== -->

    <div class="campo">

      <label for="tipoDivision">

        Dividir gasto

      </label>


      <select
        id="tipoDivision"
        [(ngModel)]="tipoDivision"
        name="tipoDivision"
      >

        <option value="IGUAL">

          Dividir por igual

        </option>


        <option value="TOTAL_A_PAGADOR">

          Se te debe la cantidad total

        </option>

      </select>

    </div>


    <!-- =====================
         FECHA Y HORA
    ====================== -->

    <div class="campo">

      <label for="fecha">

        Fecha y hora

      </label>


      <input
        id="fecha"
        type="datetime-local"
        [(ngModel)]="fecha"
        name="fecha"
      >

    </div>


    <!-- =====================
         RESUMEN
    ====================== -->

    @if (importe && importe > 0) {

      <div class="resumen-gasto">

        <span>

          Importe total

        </span>


        <strong>

          {{ importe.toFixed(2) }} €

        </strong>

      </div>

    }


    <!-- =====================
         GUARDAR
    ====================== -->

    <button
      class="btn-guardar"
      type="button"
      (click)="guardarGasto()"
    >

      @if (gastoId !== null) {

        Guardar cambios

      } @else {

        Guardar gasto

      }

    </button>


  </div>

</div>
