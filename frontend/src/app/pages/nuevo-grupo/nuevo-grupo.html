<div class="nuevo-grupo-container">


  <div class="nuevo-grupo-card">


    <!-- CABECERA -->

    <div class="nuevo-grupo-cabecera">


      <h1>

        👨‍👩‍👧‍👦 Nuevo grupo

      </h1>


      <p>

        Crea un grupo para compartir
        y gestionar gastos.

      </p>


    </div>


    <!-- FORMULARIO -->

    <div class="formulario">


      <!-- NOMBRE -->

      <div class="campo">


        <label for="nombre">

          Nombre del grupo

        </label>


        <input
          id="nombre"
          type="text"
          [(ngModel)]="nombre"
          name="nombre"
          placeholder="Ej. Familia Pérez Buseu"
        >


      </div>


      <!-- DESCRIPCIÓN -->

      <div class="campo">


        <label for="descripcion">

          Descripción

        </label>


        <textarea
          id="descripcion"
          [(ngModel)]="descripcion"
          name="descripcion"
          placeholder="Describe brevemente el grupo"
          rows="4"
        ></textarea>


      </div>


      <!-- ERROR -->

      <div
        class="mensaje-error"
        *ngIf="error"
      >

        {{ error }}

      </div>


      <!-- ACCIONES -->

      <div class="acciones">


        <button
          type="button"
          class="btn-cancelar"
          (click)="cancelar()"
          [disabled]="cargando"
        >

          Cancelar

        </button>


        <button
          type="button"
          class="btn-guardar"
          (click)="guardar()"
          [disabled]="cargando"
        >

          <span *ngIf="!cargando">

            ➕ Crear grupo

          </span>


          <span *ngIf="cargando">

            Creando...

          </span>

        </button>


      </div>


    </div>


  </div>


</div>
