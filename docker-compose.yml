services:

  # =========================
  # POSTGRESQL
  # =========================

  postgres:

    image: postgres:17

    container_name: gastos-perezbuseu-postgres

    restart: unless-stopped

    environment:

      POSTGRES_DB: ${POSTGRES_DB}

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:

      - "5432:5432"

    volumes:

      - postgres_data:/var/lib/postgresql/data


  # =========================
  # BACKEND QUARKUS
  # =========================

  backend:

    build:

      context: ./backend

      dockerfile: Dockerfile

    container_name: gastos-perezbuseu-backend

    restart: unless-stopped

    depends_on:

      - postgres

    environment:

      POSTGRES_USER: ${POSTGRES_USER}

      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}

      CORS_ORIGINS: ${CORS_ORIGINS}

      MAIL_HOST: ${MAIL_HOST}

      MAIL_PORT: ${MAIL_PORT}

      MAIL_USERNAME: ${MAIL_USERNAME}

      MAIL_PASSWORD: ${MAIL_PASSWORD}

      MAIL_FROM: ${MAIL_FROM}

      PUBLIC_APP_URL: ${PUBLIC_APP_URL}

    ports:

      - "8080:8080"

    volumes:

      - ./backend/uploads:/app/uploads


  # =========================
  # FRONTEND ANGULAR + NGINX
  # =========================

  frontend:

    build:

      context: ./frontend

      dockerfile: Dockerfile

    container_name: gastos-perezbuseu-frontend

    restart: unless-stopped

    depends_on:

      - backend


  # =========================
  # CADDY - HTTPS
  # =========================

  caddy:

    image: caddy:2

    container_name: gastos-perezbuseu-caddy

    restart: unless-stopped

    depends_on:

      - frontend
      - backend

    ports:

      - "80:80"
      - "443:443"

    volumes:

      - ./Caddyfile:/etc/caddy/Caddyfile

      - caddy_data:/data
      - caddy_config:/config


# =========================
# VOLÚMENES
# =========================

volumes:

  postgres_data:

  caddy_data:

  caddy_config: