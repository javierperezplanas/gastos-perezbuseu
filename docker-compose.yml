services:

  postgres:
    image: postgres:17

    container_name: gastos-perezbuseu-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: gastos_db
      POSTGRES_USER: gastos_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:

  postgres_data:
